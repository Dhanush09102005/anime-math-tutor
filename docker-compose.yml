services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tutor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://tutor:${POSTGRES_PASSWORD}@db:5432/tutor
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      # Persist uploaded avatars across container rebuilds.
      # Without this, every `docker compose up --build` wipes all uploaded
      # photos even though avatar_url in the DB still references the old path.
      - avatars_data:/app/static/avatars
    ports:
      - "127.0.0.1:8000:8000"
    # alembic upgrade runs on every container start — a no-op if the schema
    # is already current, and picks up new migrations automatically on deploy.
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./anime-tutor
      args:
        # The frontend container's Nginx proxies /api to the backend service.
        # This keeps browser API and OAuth requests same-origin.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  avatars_data:
